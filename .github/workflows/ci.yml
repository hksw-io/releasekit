name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and lint
    # The package declares iOS 26 / macOS 26 minimums, so the runner needs the macOS 26 SDK.
    # Xcode is pinned rather than left at the image default so the toolchain, and therefore
    # swift-format's output, stays deterministic across image updates.
    runs-on: macos-26

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # swift build only exercises the macOS side of the platform splits.
      - name: Build for iOS Simulator
        run: xcodebuild build -scheme ReleaseKit -destination 'generic/platform=iOS Simulator' -quiet

      # Enforces formatting and, via AllPublicDeclarationsHaveDocumentation,
      # that every public declaration is documented.
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests
